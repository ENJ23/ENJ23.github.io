<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title> 
    <link rel="stylesheet" href="/Tp1/Styles/formStyle.css">
    <link rel="stylesheet" href="/Tp1/Styles/darklight.css">
    <link rel="stylesheet" href="/Tp1/Styles/navbar.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>

    <!-- Navbar -->
    <header class="header" id="navbar">
        <a href="/Tp1/Pages/index.html" class="logo">GIMNASIO TOP</a>
        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <i class="bx bx-menu" id="menu-icon"></i>
            <i class="bx bx-x" id="close-menu-icon"></i>
        </label>
        <nav class="navbar">
            <a href="/Tp1/Pages/clases.html" style="--i:1">Clases</a>
            <a href="/Tp1/Pages/entrenadores.html" style="--i:2">Entrenadores</a>
            <a href="/Tp1/Pages/formulario.html" style="--i:3">Formulario</a>
            <a href="/Tp1/Pages/paginaBlog.html" style="--i:4">Blog</a>
            <a href="/Tp1/Pages/planPrices.html" style="--i:5">Precios</a>
            <a href="#" style="--i:6">
                <label class="theme-switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </a>
        </nav>
    </header>

    <div class="form-container">
        <form class="form" id="contact-form">
            <h1>Formulario de Contacto</h1>
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <div class="form-group">
                <label for="subject">Asunto:</label>
                <select id="subject" name="subject" required>
                    <option value="">Seleccione un asunto</option>
                    <option value="consulta">Consulta</option>
                    <option value="sugerencia">Sugerencia</option>
                    <option value="queja">Queja</option>
                </select>
            </div>
        <button class="form-submit-btn" type="submit">Submit</button>
        <div class="spinner" id="spinner"></div>
        </form>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h2>¡Gracias por tu mensaje!</h2>
            <p>Nos pondremos en contacto contigo pronto.</p>
        </div>
    </div>

    <footer class="footer">
        <div class="newsletter">
            <h3>Suscríbete a nuestro Newsletter</h3>
            <form>
                <input type="email" placeholder="Tu correo electrónico" required>
                <button type="submit">Suscribirse</button>
            </form>
        </div>
        <div class="social-links">
            <h3>Síguenos</h3>
            <a href="#">Facebook</a>
            <a href="#"><i class='bx bxl-instagram'> Instragram</i></a>
            <a href="#">Twitter</a>
        </div>
        <div class="map">
            <h3>Ubicación</h3>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093647!2d144.95373631550415!3d-37.81627974202198!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0x5045675218ce6e0!2sMelbourne%2C%20Australia!5e0!3m2!1sen!2s!4v1619091079349!5m2!1sen!2s"
                width="300" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </footer>
    <script src="/Tp1/JS/darkLight.js"></script>
    <script src="/Tp1/JS/scriptFormulario.js"></script>
</body>
</html>
